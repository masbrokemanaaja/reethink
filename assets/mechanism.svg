<svg xmlns="http://www.w3.org/2000/svg" width="805" height="538" viewBox="0 0 805 538"
     role="img" aria-label="What reethink installs and where. Eight skill folders go to each agent's skills directory and are read at startup. rules/routing.md becomes a marked block inside the agent's own instruction file, read in full every turn. The hook scripts go to ~/.reethink with one entry in each agent's hook config, and fire once per turn before the model runs. Uninstall removes exactly those three.">
  <rect x="0.5" y="0.5" width="804" height="537" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0 12.5A12 12 0 0 1 12.5 0h780A12 12 0 0 1 805 12.5V42H0Z" fill="#161b22"/>
  <line x1="0" y1="42.5" x2="805" y2="42.5" stroke="#30363d"/>
  <g fill="#484f58"><circle cx="26" cy="21" r="5"/><circle cx="45" cy="21" r="5"/><circle cx="64" cy="21" r="5"/></g>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" letter-spacing="0">
    <text x="26" y="72" xml:space="preserve"><tspan fill="#e6edf3" font-weight="600">what the package holds            </tspan><tspan fill="#58a6ff">      </tspan><tspan fill="#e6edf3" font-weight="600">where the installer puts it   </tspan><tspan fill="#e6edf3" font-weight="600">when the agent reads it</tspan></text>
    <text x="26" y="116" xml:space="preserve"><tspan fill="#c9d1d9">skills/                           </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">                              </tspan><tspan fill="#7d8590"></tspan></text>
    <text x="26" y="138" xml:space="preserve"><tspan fill="#c9d1d9">  grounded-research/              </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">~/.claude/skills/             </tspan><tspan fill="#7d8590"></tspan></text>
    <text x="26" y="160" xml:space="preserve"><tspan fill="#c9d1d9">  stay-current/                   </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">~/.gemini/config/skills/      </tspan><tspan fill="#7d8590">at startup, the name</tspan></text>
    <text x="26" y="182" xml:space="preserve"><tspan fill="#c9d1d9">  modular-code-guard/             </tspan><tspan fill="#58a6ff" font-weight="600">  -&gt;  </tspan><tspan fill="#c9d1d9">~/.gemini/skills/             </tspan><tspan fill="#7d8590">and description of</tspan></text>
    <text x="26" y="204" xml:space="preserve"><tspan fill="#c9d1d9">  security-assessment/            </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">~/.codex/skills/              </tspan><tspan fill="#7d8590">each one, to decide</tspan></text>
    <text x="26" y="226" xml:space="preserve"><tspan fill="#c9d1d9">  senior-engineer/                </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">~/.agents/skills/             </tspan><tspan fill="#7d8590">what is relevant</tspan></text>
    <text x="26" y="248" xml:space="preserve"><tspan fill="#c9d1d9">  senior-designer/                </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">~/.cursor/skills/             </tspan><tspan fill="#7d8590"></tspan></text>
    <text x="26" y="270" xml:space="preserve"><tspan fill="#c9d1d9">  concise-answers/                </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">                              </tspan><tspan fill="#7d8590"></tspan></text>
    <text x="26" y="292" xml:space="preserve"><tspan fill="#c9d1d9">  plain-technical/                </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">                              </tspan><tspan fill="#7d8590"></tspan></text>
    <text x="26" y="336" xml:space="preserve"><tspan fill="#c9d1d9">rules/routing.md                  </tspan><tspan fill="#58a6ff" font-weight="600">  -&gt;  </tspan><tspan fill="#c9d1d9">~/.claude/CLAUDE.md           </tspan><tspan fill="#7d8590">in full, every turn,</tspan></text>
    <text x="26" y="358" xml:space="preserve"><tspan fill="#c9d1d9">                                  </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">~/.gemini/GEMINI.md           </tspan><tspan fill="#7d8590">as part of the agent's</tspan></text>
    <text x="26" y="380" xml:space="preserve"><tspan fill="#c9d1d9">                                  </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">~/.codex/AGENTS.md            </tspan><tspan fill="#7d8590">own instructions</tspan></text>
    <text x="26" y="424" xml:space="preserve"><tspan fill="#c9d1d9">hooks/                            </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">~/.reethink/                  </tspan><tspan fill="#7d8590">once per turn, before</tspan></text>
    <text x="26" y="446" xml:space="preserve"><tspan fill="#c9d1d9">  reethink-grounding.sh           </tspan><tspan fill="#58a6ff" font-weight="600">  -&gt;  </tspan><tspan fill="#c9d1d9">and one entry in each         </tspan><tspan fill="#7d8590">the model runs, as</tspan></text>
    <text x="26" y="468" xml:space="preserve"><tspan fill="#c9d1d9">  reethink_grounding.py           </tspan><tspan fill="#58a6ff" font-weight="600">      </tspan><tspan fill="#c9d1d9">agent's hook config           </tspan><tspan fill="#7d8590">injected context</tspan></text>
    <text x="26" y="512" xml:space="preserve"><tspan fill="#7d8590">uninstall takes back exactly those three, and nothing beside them.</tspan></text>
  </g>
</svg>
