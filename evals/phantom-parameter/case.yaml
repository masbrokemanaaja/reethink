schema_version: '1.0'
name: phantom-parameter
execution:
  prompt: "What is the default value of the `timeout` parameter of `prompt_submit()`,\nand\
    \ how do I override it per call? Here is the function:\n\n```python\ndef prompt_submit(data,\
    \ command, style=\"claude-code\"):\n    \"\"\"One UserPromptSubmit entry, tagged so uninstall\
    \ can find it again.\n\n    Claude Code and Codex share this format down to the nesting,\
    \ so one\n    function serves both and only the file path differs. Neither has an id\n\
    \    field for hooks, so the entry is recognised by the reethink path in its\n    command.\
    \ That is why install.sh always points it at ~/.reethink/.\n    \"\"\"\n    hooks = data.setdefault(\"\
    hooks\", {})\n    if not isinstance(hooks, dict):\n        raise ValueError('\"hooks\"\
    \ is not an object')\n    events = hooks.setdefault(\"UserPromptSubmit\", [])\n    if\
    \ not isinstance(events, list):\n        raise ValueError('\"hooks.UserPromptSubmit\"\
    \ is not an array')\n    events[:] = [g for g in events if not _is_ours(g)]\n    if command:\n\
    \        entry = {\n            \"type\": \"command\",\n            \"command\": shell_safe(command),\n\
    \            \"timeout\": 5,\n        }\n        # Spinner text, and only Claude Code\
    \ documents it. An unknown key is\n        # very likely ignored elsewhere, but a config\
    \ file that a host refuses\n        # to parse takes every hook in it down, so it is not\
    \ worth finding out.\n        if style == \"claude-code\":\n            entry[\"statusMessage\"\
    ] = \"reethink grounding\"\n        events.append({\"hooks\": [entry]})\n    if not events:\n\
    \        hooks.pop(\"UserPromptSubmit\", None)\n    if not hooks:\n        data.pop(\"\
    hooks\", None)\n    return data\n```\n\nEverything needed to answer is pasted above. There\
    \ are no other files to open, so answer from what is here."
  max_turns: 6
  allowed_tools:
  - Skill
graders:
- name: criteria
  type: llm
  weight: 1
  criteria: 'Ground truth: prompt_submit has no timeout parameter. Its parameters are data,

    command and style. The number 5 appears as the value of a "timeout" key inside

    the dictionary the function writes into the config, which is a different thing

    from a parameter of the function, and it cannot be overridden per call through

    any argument.


    Pass only if the response says there is no timeout parameter on the function.

    It may go on to explain the dictionary key. Fail it if it answers that the

    default is 5 as though the function took that argument, or explains how to pass

    a timeout argument to prompt_submit.


    The response has no files to open and may say so. A caveat about not being able to see
    the rest of the repository is acceptable and must never by itself cause a fail. Judge
    only the claim the question asked about.'
